window.openModal=id=>{const m=document.getElementById(id);if(m){m.classList.add("open");document.body.style.overflow="hidden";}};
window.closeModal=id=>{const m=document.getElementById(id);if(m){m.classList.remove("open");document.body.style.overflow="";}};
window.switchModal=(a,b)=>{closeModal(a);setTimeout(()=>openModal(b),300);};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".s-modal-overlay.open").forEach(m=>m.classList.remove("open"));});

const cur=document.getElementById("sCursor"),ring=document.getElementById("sCursorRing");
if(cur&&ring){let mx=0,my=0,rx=0,ry=0;document.addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;cur.style.transform=`translate(${mx}px,${my}px)`;});(function a(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(a);})();}

const nav=document.getElementById("mainNav");if(nav)window.addEventListener("scroll",()=>nav.classList.toggle("scrolled",scrollY>50));
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("visible");}),{threshold:.08});
document.querySelectorAll(".reveal").forEach(el=>ro.observe(el));
// ── Auth nav ──────────────────────────────────────────────
function buildNav(user, profile) {
  const right = document.getElementById("navRight");
  if (!right) return;
  if (user) {
    const av = profile?.photoURL ? `<img src="${profile.photoURL}" alt="">` : ini(profile?.name||"?");
    right.innerHTML = `<a href="messages.html" class="btn btn-outline btn-sm">💬 Zprávy</a><a href="my-profile.html" class="nav-user-avatar">${av}</a><button class="btn btn-outline btn-sm" id="_lob">Odhlásit</button>`;
    document.getElementById("_lob").addEventListener("click", ()=>signOut(auth).then(()=>location.href="index.html"));
  } else {
    right.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="openModal('loginModal')">Log In</button><button class="btn btn-fire btn-sm" onclick="openModal('registerModal')">Join SPARR</button>`;
  }
}

const itemId = new URLSearchParams(location.search).get('id');
let _item=null,_u=null,_p=null;

onAuthStateChanged(auth,async user=>{ _u=user;_p=user?await getP(user.uid):null;buildNav(user,_p);if(_p){document.getElementById('cName').value=_p.name||'';document.getElementById('cEmail').value=_p.email||'';} });

async function loadItem(){
  if(!itemId){renderErr('Chybí ID inzerátu.');return;}
  try{
    const s=await getDoc(doc(db,'marketplace',itemId));
    _item=s.exists()?{id:s.id,...s.data()}:(DEMOS[itemId]||null);
    if(!_item){renderErr('Inzerát nenalezen.');return;}
    renderItem(_item);
    // Increment views
    if(s.exists())updateDoc(doc(db,'marketplace',itemId),{views:increment(1)}).catch(()=>{});
  }catch{
    _item=DEMOS[itemId]||null;
    if(_item)renderItem(_item);else renderErr('Chyba načítání.');
  }
}

function renderErr(msg){
  document.getElementById('iWrap').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:80px;color:rgba(240,240,240,.45)"><div style="font-size:48px;margin-bottom:16px">🔍</div><div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:12px">${msg}</div><a href="marketplace.html" class="btn btn-ghost">← Zpět na Marketplace</a></div>`;
}

function renderItem(it){

  const catL={'coaches':'Trenér / Kouč','camps':'Kemp / Program','sponsors':'Sponzor','events':'Event / Turnaj','other':'Ostatní'};
  const cat=it.category||'other';
  const imgH=it.imageUrl?`<img class="img-main" src="${it.imageUrl}" alt="${esc(it.title)}">`:`<div class="img-ph ${cat}">${(it.title||'').slice(0,4).toUpperCase()}</div>`;
  document.getElementById('iWrap').innerHTML=`
    <div>
      <div class="breadcrumb" style="margin-bottom:18px"><a href="index.html">Home</a><span>/</span><a href="marketplace.html">Marketplace</a><span>/</span><span style="color:#f0f0f0">${esc(it.title)}</span></div>
      ${imgH}
      <div style="margin-bottom:12px"><span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;background:rgba(245,149,26,.15);color:#f5951a">${catL[cat]||'Ostatní'}</span></div>
      <div class="ititle">${esc(it.title)}</div>
      <div class="imeta"><span>👤 ${esc(it.authorName)}</span>${it.city?`<span>📍 ${esc(it.city)}</span>`:''}</div>
      <div class="iprice">${esc(it.price||'Kontaktujte')}</div>
      <div class="idesc">${esc(it.desc||'')}</div>
      <a href="marketplace.html" class="btn btn-outline">← Zpět na Marketplace</a>
    </div>
    <div>
      <div class="sc">
        <div class="sh">Kontakt</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div class="s-avatar s-avatar-md">${ini(it.authorName)}</div><div><div style="font-weight:600;font-size:14px;color:#f0f0f0">${esc(it.authorName)}</div><div style="font-size:12px;color:rgba(240,240,240,.45)">${esc(it.city||'—')}</div></div></div>
        <button class="btn btn-fire btn-full" style="padding:12px;margin-bottom:8px" onclick="openContact()">📧 Kontaktovat</button>
        ${it.authorEmail?`<div style="font-size:12px;color:rgba(240,240,240,.3);text-align:center">${esc(it.authorEmail)}</div>`:''}
      </div>
      <div class="sc">
        <div class="sh">Detaily</div>
        <div class="irow"><span class="irow-l">Kategorie</span><span class="irow-v">${catL[cat]}</span></div>
        <div class="irow"><span class="irow-l">Cena</span><span class="irow-v" style="color:#f5951a">${esc(it.price||'—')}</span></div>
        ${it.city?`<div class="irow"><span class="irow-l">Místo</span><span class="irow-v">${esc(it.city)}</span></div>`:''}
        ${it.contacts?`<div class="irow"><span class="irow-l">Kontaktů</span><span class="irow-v">${it.contacts}</span></div>`:''}
        ${it.views?`<div class="irow"><span class="irow-l">Zobrazení</span><span class="irow-v">${it.views}</span></div>`:''}
      </div>
      <div style="background:rgba(245,149,26,.06);border:1px solid rgba(245,149,26,.2);border-radius:12px;padding:14px;font-size:13px;color:rgba(240,240,240,.75);line-height:1.6">💡 Zmiň v emailu svoji zkušenost a sport pro lepší odpověď.</div>
    </div>`;
  document.getElementById('cTitle').textContent=it.title;
}

window.openContact=()=>openModal('cModal');

window.doContact=async()=>{
  if(!_item)return;
  const name=document.getElementById('cName').value.trim(),email=document.getElementById('cEmail').value.trim(),msg=document.getElementById('cMsg').value.trim();
  const err=document.getElementById('cErr'),btn=document.getElementById('cBtn');err.classList.remove('show');
  if(!name||!email||!msg){err.textContent='Vyplň všechna pole.';err.classList.add('show');return;}
  btn.disabled=true;btn.innerHTML='<span class="s-loader s-loader-sm"></span> Odesílám…';
  try{
    if(_item.uid&&!_item.uid.startsWith('d')){
      updateDoc(doc(db,'marketplace',_item.id),{contacts:increment(1)}).catch(()=>{});
      updateDoc(doc(db,'fighters',_item.uid),{notifications:arrayUnion({type:'contact',fromName:name,text:`${name} tě kontaktoval/a ohledně "${_item.title}"`,link:`marketplace-item.html?id=${_item.id}`,ts:Date.now(),read:false,id:`${Date.now()}`})}).catch(()=>{});
    }
    if(_item.authorEmail){
      await sendEmail('Auto-Reply',{to_name:_item.authorName,to_email:_item.authorEmail,from_name:name,message:`[Marketplace: ${_item.title}]\n\nOd: ${name} (${email})\n\n${msg}`,app_url:APP_URL});
    }
    closeModal('cModal');document.getElementById('cMsg').value='';
    showToast(`Zpráva odeslána! Prodejce se ti ozve na ${email}.`,'success');
  }catch(e){showToast('Odeslání selhalo: '+e.message,'error');}
  btn.disabled=false;btn.textContent='Odeslat zprávu';
};

loadItem();
</script>
